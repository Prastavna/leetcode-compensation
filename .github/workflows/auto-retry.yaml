name: auto-retry

on:
  workflow_run:
    workflows:
      - automatic-data-update
      - deploy-site
      - manual-data-cleanup
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  retry:
    # Transient upstream failures (LeetCode API, OpenRouter 503, GitHub Pages API) usually
    # clear up on their own; retry the failed jobs a couple of times before giving up.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    concurrency:
      group: auto-retry-${{ github.event.workflow_run.id }}
      cancel-in-progress: false

    steps:
      - name: Wait before retrying
        run: sleep $(( ${{ github.event.workflow_run.run_attempt }} * 60 ))

      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          echo "Retrying ${{ github.event.workflow_run.name }} run $RUN_ID (attempt $ATTEMPT failed)"
          gh run rerun "$RUN_ID" --failed --repo "${{ github.repository }}"
